<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KinoVerse - Қош келдіңіз</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Arial', sans-serif;
      background: url('https://source.unsplash.com/1600x900/?cinema,film') no-repeat center center/cover;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      width: 80%;
      max-width: 1000px;
    }
    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      text-align: center;
      transition: transform 0.3s, background 0.3s;
    }
    .card:hover {
      transform: translateY(-10px);
      background: rgba(255,255,255,0.2);
    }
    .card h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    .card a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #ff0055;
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .card a:hover { background: #e60044; }

    /* Іздеу стилі */
    .search-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      width: 80%;
      max-width: 1000px;
      display: flex;
      justify-content: center;
    }
    .search-bar {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
      border-radius: 50px;
      border: 1px solid #ccc;
      outline: none;
    }
    .search-bar:focus {
      border-color: #ff0055;
    }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- Іздеу жолағы -->
  <div class="search-container">
    <input class="search-bar" type="text" placeholder="Фильмдер бойынша іздеу..." />
  </div>

  <div class="container">
    <div class="card">
      <h2>🎬 Фильмдер</h2>
      <p>Кіріп, ең жаңа және үздік фильмдерді табыңыз</p>
      <a href="/films">Көру</a>
    </div>
    <div class="card">
      <h2>👥 Қолданушылар</h2>
      <p>Қауымдастыққа қосылып, фильмдер туралы пікір қалдырыңыз</p>
      <a href="/users">Қарау</a>
    </div>
    <div class="card">
      <h2>🔐 Кіру</h2>
      <p>Тіркелгіңізге кіріп, толық мүмкіндіктерді ашыңыз</p>
      <a href="/login">Кіру</a>
    </div>
    <div class="card">
      <h2>📝 Тіркелу</h2>
      <p>Жаңа аккаунт жасап, барлық функцияларды пайдаланыңыз</p>
      <a href="/register">Тіркелу</a>
    </div>
  </div>
</body>
</html>
